services:
  app:
    build:
      context: .
      # 构建期复用宿主机网络：部分环境里构建容器 DNS 不可用
      network: host
    image: pt-seedflow:latest
    container_name: pt-seedflow
    # 使用 host 网络：qBittorrent 的"本机免认证"只对 127.0.0.1 生效，
    # 桥接网络下容器来源 IP 会被拒（403）。
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 配置与 SQLite 状态库
      - ./data:/root/.pt-seedflow
      # 站点 api key，只读挂载，路径与示例配置保持一致
      - ${HOME}/.rss:/root/.rss:ro
