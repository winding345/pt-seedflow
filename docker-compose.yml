services:
  app:
    build:
      context: .
      # 构建期复用宿主机网络：部分环境里构建容器 DNS 不可用
      network: host
    image: pt-seedflow:latest
    container_name: pt-seedflow
    restart: unless-stopped
    ports:
      - "8600:8600"
    extra_hosts:
      # 容器内通过 host.docker.internal 访问宿主机上的 qBittorrent
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 配置与 SQLite 状态库
      - ./data:/root/.pt-seedflow
      # 站点 api key，只读挂载，路径与示例配置保持一致
      - ${HOME}/.rss:/root/.rss:ro
