services:
  app:
    build:
      context: .
      # 构建期复用宿主机网络：部分环境里构建容器 DNS 不可用
      network: host
    image: pt-seedflow:latest
    container_name: pt-seedflow
    # 使用 host 网络：qBittorrent 的"本机免认证"只对 127.0.0.1 生效，
    # 桥接网络下容器来源 IP 会被拒（403）；容器内的 MySQL 也因此直接监听 3366。
    network_mode: host
    # 注意：host 网络下 ports 不会被 Docker 使用（会提示 discarded），
    # 保留是为了让飞牛/fnConnect 能从 compose 声明里识别出可访问的端口。
    ports:
      - "8600:8600"      # Web 面板
      - "3366:3366"      # 容器内 MySQL（仅 MySQL 版需要）
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 容器内 MySQL（与应用同容器）
      - PT_DB_HOST=127.0.0.1
      - PT_DB_PORT=3366
      - PT_DB_NAME=${MYSQL_DATABASE:-ptsf}
      - PT_DB_USER=${MYSQL_USER:-ptsf}
      - PT_DB_PASSWORD=${MYSQL_PASSWORD:-ptsf_change_me}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-ptsf_root_change_me}
      # 设为 1 时，启动用 config.yaml 覆盖数据库配置
      - PT_CFG_FORCE=${PT_CFG_FORCE:-0}
    volumes:
      # 启动用的配置文件（配置与统计都在 MySQL）
      - ./data:/root/.pt-seedflow
      # MySQL 数据目录，容器重建不丢
      - ./mysql-data:/var/lib/mysql
      # 站点 api key，只读挂载，路径与示例配置保持一致
      - ${HOME}/.rss:/root/.rss:ro
