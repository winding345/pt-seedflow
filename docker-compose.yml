services:
  mysql:
    image: mysql:8.0
    container_name: pt-seedflow-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ptsf}
      MYSQL_USER: ${MYSQL_USER:-ptsf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # 宿主机 3366 → 容器 3306：局域网里可直接用客户端连
      - "3366:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      # 构建期复用宿主机网络：部分环境里构建容器 DNS 不可用
      network: host
    image: pt-seedflow:latest
    container_name: pt-seedflow
    # 使用 host 网络：qBittorrent 的"本机免认证"只对 127.0.0.1 生效，
    # 桥接网络下容器来源 IP 会被拒（403）。
    network_mode: host
    # host 网络下 ports 不生效，保留是为了让飞牛/fnConnect 能识别出可访问端口
    ports:
      - "8600:8600"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - PT_DB_HOST=127.0.0.1
      - PT_DB_PORT=3366
      - PT_DB_NAME=${MYSQL_DATABASE:-ptsf}
      - PT_DB_USER=${MYSQL_USER:-ptsf}
      - PT_DB_PASSWORD=${MYSQL_PASSWORD}
      # 设为 1 时，启动用 config.yaml 覆盖数据库配置
      - PT_CFG_FORCE=${PT_CFG_FORCE:-0}
    volumes:
      # 启动用的配置文件（配置与统计都在 MySQL）
      - ./data:/root/.pt-seedflow
      # 站点 api key，只读挂载，路径与示例配置保持一致
      - ${HOME}/.rss:/root/.rss:ro
